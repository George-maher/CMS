[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
startretries=3
startsecs=5
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
startretries=3
startsecs=5
priority=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ──────────────────────────────────────────────
# Queue Worker — REQUIRED for email delivery
# ──────────────────────────────────────────────
# All notifications (password-reset submitted/approved/rejected, password
# changed, verification, invites, etc.) are queued (ShouldQueue). With
# QUEUE_CONNECTION=database, jobs sit in the `jobs` table until a worker
# processes them. Without this program, NO transactional email is ever sent
# in the single-container production deploy (Railway). Supervisor auto-restarts
# the worker if it crashes, and release runs release work on boot.
[program:queue-worker]
command=php artisan queue:work database --sleep=3 --tries=3 --timeout=90 --queue=default --max-time=3600 --memory=128
autostart=true
autorestart=true
startretries=3
startsecs=5
priority=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
