[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
directory=/var/www
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
directory=/var/www
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
priority=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# The queue worker reads QUEUE_CONNECTION from Laravel configuration. Database
# and Redis are both supported; Supervisor does not force one driver.
[program:queue-worker]
command=/usr/local/bin/php artisan queue:work --sleep=3 --tries=3 --timeout=90 --queue=default --max-time=3600 --memory=128
directory=/var/www
user=www-data
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
priority=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/usr/local/bin/php artisan schedule:work
directory=/var/www
user=www-data
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
priority=4
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
