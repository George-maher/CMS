services:

  # ──────────────────────────────────────────────
  # PostgreSQL — local database for development
  # ──────────────────────────────────────────────
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: church_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: church_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - church_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ──────────────────────────────────────────────
  # Dev overrides — source mounts for hot reload
  # ──────────────────────────────────────────────
  app:
    build:
      target: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/var/www
      - /var/www/vendor

  nginx:
    volumes:
      - ./backend:/var/www
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      target: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/var/www
      - /var/www/vendor

  scheduler:
    build:
      target: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/var/www
      - /var/www/vendor

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: church_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_PROXY: http://nginx
      VITE_API_URL: /api
    networks:
      - church_network
    depends_on:
      nginx:
        condition: service_started
    # Mount only source directories (not node_modules) to preserve image deps
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./frontend/eslint.config.js:/app/eslint.config.js
      - ./frontend/package.json:/app/package.json
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

volumes:
  postgres_data:
