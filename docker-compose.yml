services:

  # ──────────────────────────────────────────────
  # Backend PHP-FPM Application
  # ──────────────────────────────────────────────
  app:
    image: ${IMAGE_TAG:-chproject_app}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${APP_TARGET:-development}
    container_name: church_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - backend_storage:/var/www/storage
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
    networks:
      - church_network
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q php-fpm || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ──────────────────────────────────────────────
  # Nginx Reverse Proxy
  # ──────────────────────────────────────────────
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: church_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - ./backend/public:/var/www/public:ro
      - backend_storage:/var/www/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - church_network
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.3"

  # ──────────────────────────────────────────────
  # Frontend (production: nginx serving built assets)
  # ──────────────────────────────────────────────
  # Queue Worker (reuses app image)
  # ──────────────────────────────────────────────
  worker:
    image: ${IMAGE_TAG:-chproject_app}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${APP_TARGET:-development}
    container_name: church_worker
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work database --sleep=3 --tries=3 --backoff=60 --timeout=90 --queue=default
    volumes:
      - backend_storage:/var/www/storage
    env_file:
      - ./backend/.env
    networks:
      - church_network
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q 'queue:work' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ──────────────────────────────────────────────
  # Scheduler (reuses app image)
  # ──────────────────────────────────────────────
  scheduler:
    image: ${IMAGE_TAG:-chproject_app}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${APP_TARGET:-development}
    container_name: church_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - backend_storage:/var/www/storage
    env_file:
      - ./backend/.env
    networks:
      - church_network
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q 'schedule:work' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.3"

volumes:
  backend_storage:

networks:
  church_network:
    driver: bridge
