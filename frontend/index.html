<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Primary Meta -->
    <title>Church Manager</title>
    <meta name="description" content="Church Management System — Manage your church community with attendance tracking, events, and member management." />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" sizes="32x32" href="/icons/favicon-32.svg" />
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="/icons/favicon-16.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#d4af37" />

    <!-- Apple Touch Icons (iOS — MUST be PNG, SVG is NOT supported) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-touch-icon.png" />

    <!-- iOS PWA Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Church Manager" />
    <meta name="apple-touch-fullscreen" content="yes" />

    <!-- Android themed color (light/dark aware) -->
    <meta name="theme-color" content="#0f1d3d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
    <meta name="msapplication-navbutton-color" content="#0f1d3d" />
    <meta name="msapplication-TileColor" content="#0f1d3d" />

    <!-- Windows Tiles -->
    <meta name="msapplication-config" content="none" />

    <!-- Splash screen orientation lock -->
    <meta name="x5-orientation" content="portrait" />
    <meta name="screen-orientation" content="portrait" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Startup / Performance -->
    <meta http-equiv="x-dns-prefetch-control" content="on" />

    <!-- OG Meta -->
    <meta property="og:title" content="Church Manager" />
    <meta property="og:description" content="Church Management System — Manage your church community with attendance tracking, events, and member management." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
