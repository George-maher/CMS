<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f1d3d"/>
    </linearGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#e8c95a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Church body -->
  <rect x="136" y="224" width="240" height="200" rx="12" fill="#fdf8e8" opacity="0.95"/>
  <!-- Church roof -->
  <polygon points="256,64 112,224 400,224" fill="url(#cross)"/>
  <!-- Cross on top -->
  <rect x="246" y="24" width="20" height="60" rx="6" fill="url(#cross)"/>
  <rect x="218" y="48" width="76" height="20" rx="6" fill="url(#cross)"/>
  <!-- Door -->
  <rect x="214" y="340" width="84" height="84" rx="42" fill="#1e3a8a"/>
  <!-- Door arch -->
  <path d="M214,360 A42,42 0 0,1 298,360" fill="#1e3a8a"/>
  <!-- Window left -->
  <rect x="158" y="260" width="40" height="52" rx="20" fill="#d4af37" opacity="0.6"/>
  <!-- Window right -->
  <rect x="314" y="260" width="40" height="52" rx="20" fill="#d4af37" opacity="0.6"/>
  <!-- Steeple -->
  <rect x="248" y="196" width="16" height="28" rx="4" fill="url(#cross)"/>
</svg>
