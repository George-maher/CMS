<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f1d3d"/>
    </linearGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#e8c95a"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="32" fill="url(#bg)"/>
  <!-- Church body -->
  <rect x="56" y="88" width="80" height="72" rx="4" fill="#fdf8e8" opacity="0.95"/>
  <!-- Church roof -->
  <polygon points="96,32 48,88 144,88" fill="url(#cross)"/>
  <!-- Cross on top -->
  <rect x="92" y="16" width="8" height="24" rx="2" fill="url(#cross)"/>
  <rect x="84" y="24" width="24" height="8" rx="2" fill="url(#cross)"/>
  <!-- Door -->
  <rect x="82" y="124" width="28" height="36" rx="14" fill="#1e3a8a"/>
  <!-- Door arch -->
  <path d="M82,136 A14,14 0 0,1 110,136" fill="#1e3a8a"/>
  <!-- Window left -->
  <rect x="64" y="100" width="14" height="18" rx="7" fill="#d4af37" opacity="0.6"/>
  <!-- Window right -->
  <rect x="114" y="100" width="14" height="18" rx="7" fill="#d4af37" opacity="0.6"/>
  <!-- Steeple line -->
  <rect x="94" y="80" width="4" height="8" rx="2" fill="url(#cross)"/>
</svg>
