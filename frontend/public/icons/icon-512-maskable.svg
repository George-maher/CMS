<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f1d3d"/>
    </linearGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#e8c95a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="0" fill="url(#bg)"/>
  <!-- Safe zone circle - maskable icons use the inner 80% -->
  <!-- But for simplicity and to ensure it looks good both masked and unmasked, fill entire area -->
  <!-- Church body - centered and scaled to be within safe zone (inner 80%) -->
  <rect x="156" y="240" width="200" height="180" rx="10" fill="#fdf8e8" opacity="0.95"/>
  <!-- Church roof -->
  <polygon points="256,100 131,240 381,240" fill="url(#cross)"/>
  <!-- Cross on top -->
  <rect x="248" y="60" width="16" height="55" rx="6" fill="url(#cross)"/>
  <rect x="224" y="82" width="64" height="16" rx="6" fill="url(#cross)"/>
  <!-- Door -->
  <rect x="220" y="340" width="72" height="80" rx="36" fill="#1e3a8a"/>
  <!-- Door arch -->
  <path d="M220,358 A36,36 0 0,1 292,358" fill="#1e3a8a"/>
  <!-- Window left -->
  <rect x="174" y="274" width="36" height="44" rx="18" fill="#d4af37" opacity="0.6"/>
  <!-- Window right -->
  <rect x="302" y="274" width="36" height="44" rx="18" fill="#d4af37" opacity="0.6"/>
  <!-- Cross center detail -->
  <circle cx="256" cy="200" r="16" fill="#d4af37" opacity="0.3"/>
</svg>
