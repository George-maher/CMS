<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1d3d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Offline — Church Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { height: 100%; }
    body {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f1d3d 0%, #1e3a8a 100%);
      color: #f1f5f9;
      padding: 1rem;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      width: 96px;
      height: 96px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, #d4af37, #e8c95a);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(212, 175, 55, 0.3);
    }
    .icon svg {
      width: 56px;
      height: 56px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #e8c95a;
    }
    p {
      font-size: 0.9375rem;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      color: #0f172a;
      background: linear-gradient(135deg, #d4af37, #e8c95a);
      box-shadow: 0 4px 16px rgba(212, 175, 55, 0.3);
      transition: all 0.3s ease;
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(212, 175, 55, 0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
        <rect x="20" y="40" width="60" height="50" rx="4" fill="#fdf8e8" opacity="0.95"/>
        <polygon points="50,8 15,40 85,40" fill="#0f1d3d"/>
        <rect x="46" y="0" width="8" height="22" rx="3" fill="#d4af37"/>
        <rect x="38" y="8" width="24" height="8" rx="3" fill="#d4af37"/>
        <rect x="38" y="62" width="24" height="28" rx="14" fill="#1e3a8a"/>
        <rect x="26" y="50" width="12" height="18" rx="6" fill="#d4af37" opacity="0.6"/>
        <rect x="62" y="50" width="12" height="18" rx="6" fill="#d4af37" opacity="0.6"/>
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>Please check your internet connection and try again. Some pages may still be available from cache.</p>
    <a href="/" class="btn" onclick="window.location.reload()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Retry Connection
    </a>
  </div>
</body>
</html>
